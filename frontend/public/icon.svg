<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="64" fill="#0f172a"/>
  <rect x="24" y="24" width="464" height="464" rx="48" fill="#f8fafc" stroke="#0f172a" stroke-width="12"/>
  
  <!-- Edge Node Circuit / Air Flow Symbol -->
  <circle cx="160" cy="180" r="44" fill="#16a34a" stroke="#0f172a" stroke-width="10"/>
  <circle cx="352" cy="180" r="44" fill="#0284c7" stroke="#0f172a" stroke-width="10"/>
  <circle cx="256" cy="340" r="54" fill="#ea580c" stroke="#0f172a" stroke-width="10"/>
  
  <!-- Interconnecting telemetry lines -->
  <line x1="160" y1="180" x2="256" y2="340" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <line x1="352" y1="180" x2="256" y2="340" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <line x1="160" y1="180" x2="352" y2="180" stroke="#0f172a" stroke-width="12" stroke-linecap="round" stroke-dasharray="16 12"/>
  
  <!-- Sensor Core Node -->
  <circle cx="256" cy="340" r="22" fill="#ffffff" stroke="#0f172a" stroke-width="8"/>
  <circle cx="160" cy="180" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="6"/>
  <circle cx="352" cy="180" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="6"/>
